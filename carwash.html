<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة مغسلة لمعة | شاهين ديزاين</title>
<meta name="description" content="تجربة حية لنظام بطاقات الولاء والدفع والتقييم للمغاسل، من شاهين ديزاين.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لمعة">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="/vendor/qrcode.js"></script>
<script src="/vendor/jsQR.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: role bar on top · customer and staff are phone columns (440px) · owner is a two-column dashboard */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface2:#F5F8FA; --ink:#101C26; --muted:#56646F; --line:#DCE3E9;
  --brand:#0A2540; --brand-ink:#FFFFFF; --aqua:#5CD3F0; --aqua-ink:#0A2540; --gold:#F2C14E;
  --ok:#17804D; --ok-bg:#E2F4EA; --gold-bg:#FFF3D3; --gold-ink:#7A5608; --danger:#C0303A;
  --wallet:#E4EAF0; color-scheme:light;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
:focus-visible{outline:2px solid #2BA6CF;outline-offset:2px}
button{font:inherit;color:inherit}
/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--aqua);display:grid;place-items:center;flex-shrink:0}
.brand b{font-family:var(--display);font-size:18px;display:block;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.roles{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.roles button{border:0;background:transparent;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px}
.roles button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA8B5;display:inline-block}
.dot.live{background:#22B573;box-shadow:0 0 0 3px rgba(34,181,115,.2)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
/* shared */
.col{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:600;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.black{background:#000;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.aqua{background:var(--aqua);color:var(--aqua-ink)}
.btn.gold{background:var(--gold);color:#0A2540}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=tel],input[type=search],textarea,select{min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-weight:400;background:var(--surface2);color:var(--ink);width:100%}
textarea{padding:10px 14px;resize:vertical;min-height:84px}
.err{color:var(--danger);font-size:13.5px;margin:0}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;display:inline-block}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.gold{background:var(--gold-bg);color:var(--gold-ink)}.chip.n{background:var(--surface2);color:var(--muted)}
/* onboarding */
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--aqua)}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.types button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 2px}
.types button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--surface2)}
.types svg{width:54px;height:22px}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:44px;height:44px;border-radius:50%;cursor:pointer;border:1px solid #A9B4BE;padding:0}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--brand)}
.stage{background:linear-gradient(180deg,#123B63,#0D2E4F);border-radius:16px;padding:12px 0 6px;display:flex;flex-direction:column;align-items:center;color:#CFE3F2;font-size:12px}
/* wallet */
.wallet{background:var(--wallet);border-radius:26px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:12px}
.wallet .wh{display:flex;justify-content:space-between;align-items:center;color:var(--ink);padding:0 4px}
.wallet .wh b{font-family:var(--display);font-size:22px}
.pass{width:100%;border-radius:16px;overflow:hidden;background:#0A2540;color:#fff;box-shadow:0 12px 30px rgba(10,37,64,.28)}
.pass .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.pass .lbl{font-size:10px;font-weight:600;color:#5CD3F0;letter-spacing:.6px}
.pass .big{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.strip{height:146px;background:linear-gradient(180deg,#123B63,#0D2E4F);padding:14px 14px 10px;display:flex;flex-direction:column;justify-content:space-between}
.strip.done{background:linear-gradient(135deg,#F2C14E,#E8A93A);color:#0A2540;align-items:center;justify-content:center;gap:2px;text-align:center}
.stamps{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stamp{height:34px;border-radius:9px;display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.35);font-size:11px;font-weight:600;color:rgba(255,255,255,.55)}
.stamp.on{background:#5CD3F0;border:0}
.stamp.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fields{display:flex;justify-content:space-between;gap:8px;padding:14px 16px 4px}
.fields>div:nth-child(2){text-align:center}.fields>div:last-child{text-align:left}
.fields .v{font-size:14.5px;font-weight:600}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 18px}
.qr .box{background:#fff;border-radius:12px;padding:10px;line-height:0}
.qr .box svg{width:132px;height:132px}
.qr small{font-size:11px;color:#9DB7CC;direction:ltr}
.back{border-radius:16px;background:#fff;color:#13202B;overflow:hidden}
.back .r{padding:11px 16px;border-bottom:1px solid #E5EAEE}.back .r:last-child{border:0}
.back .k{font-size:11px;font-weight:600;color:#56646F}
.visits{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.visits div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}
.visits time{color:var(--muted);font-variant-numeric:tabular-nums}
/* toast (lock screen) */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);width:min(380px,calc(100% - 32px));background:rgba(250,251,252,.97);color:#13202B;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:10px 12px;display:flex;gap:10px;align-items:center;transition:transform .35s ease;z-index:30}
.toast.show{transform:translate(-50%,0)}
.toast .logo{width:36px;height:36px;border-radius:10px;background:#0A2540}
/* staff */
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:300px;margin:0 auto;width:100%}
.keypad button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);font-family:var(--display);font-size:22px;font-weight:600;cursor:pointer}
.pinDots{display:flex;gap:14px;justify-content:center;margin:6px 0 4px}
.pinDots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.pinDots i.on{background:var(--brand);border-color:var(--brand)}
.scanBtn{width:100%;border:0;border-radius:22px;background:var(--brand);color:var(--brand-ink);padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:var(--display);font-size:19px;font-weight:600}
.scanBtn .ring{width:84px;height:84px;border-radius:50%;background:rgba(92,211,240,.18);display:grid;place-items:center}
.sheet{border:2px solid var(--aqua);}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:7px;border:1.5px dashed var(--line)}.dots i.on{background:var(--aqua);border:0}
.list{display:flex;flex-direction:column}
.mem{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:58px}
.mem:last-child{border-bottom:0}
.mem .who{flex:1;min-width:0}.mem .who b{display:block;font-size:14.5px;line-height:1.35}.mem .who span{font-size:12.5px;color:var(--muted)}
.carchip{flex-shrink:0;background:linear-gradient(180deg,#123B63,#0D2E4F);border-radius:10px;padding:2px 5px;line-height:0}
/* owner */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .n{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .t{font-size:13px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 12px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;width:84px;flex-shrink:0}.bar i{display:block;height:100%;background:var(--aqua)}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px}
.hbar .t{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--brand)}
.feed{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.feed div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.feed time{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lockprev{background:linear-gradient(160deg,#2B3E57,#0F1C2B);border-radius:16px;padding:14px}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr}
.stars button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;display:grid;place-items:center;color:var(--line)}
.stars button[aria-pressed="true"]{color:#F2B527;border-color:#F2C14E;background:var(--gold-bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 12px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.tags button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rate{border:2px solid #F2C14E}
.st{color:#F2B527;letter-spacing:1px;direction:ltr;display:inline-block;white-space:nowrap}
.rv{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}.rv:last-child{border-bottom:0}
.rv.low{background:linear-gradient(90deg,transparent,var(--gold-bg));}
.pkgs{display:flex;flex-direction:column;gap:8px}
.pkg{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);cursor:pointer;text-align:right;width:100%}
.pkg[aria-pressed="true"]{border:2px solid var(--brand);background:var(--surface2)}
.pkg .pr{font-family:var(--display);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.addon{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.addon input{width:20px;height:20px}
.track{display:flex;align-items:center;gap:6px}
.track .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.track .c{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface)}
.track .s.on{color:var(--ink);font-weight:600}.track .s.on .c{background:var(--aqua);border-color:var(--aqua);color:#0A2540}
.track .ln{flex:0 0 18px;height:2px;background:var(--line);margin-bottom:22px}
.inv{background:#fff;color:#13202B;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.inv .ih{background:#0A2540;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.inv table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.inv td{padding:7px 0;border-bottom:1px dashed #E1E6EA}.inv td:last-child{text-align:left;white-space:nowrap}
.inv .ib{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.inv .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.inv .meta span{color:#56646F;display:block;font-size:11.5px}
.inv .tot td{border:0;font-weight:700;font-size:16px}
.qrsm svg{width:84px;height:84px}
.ord{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ord:last-child{border-bottom:0}
.paying{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--aqua);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scanner{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.scanner .vw{position:relative;width:min(88vw,420px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:#111}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .fr{position:absolute;inset:14%;border:3px solid #5CD3F0;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanner .ln2{position:absolute;left:16%;right:16%;height:2px;background:#5CD3F0;top:50%;animation:scanl 1.8s ease-in-out infinite}
@keyframes scanl{0%,100%{top:18%}50%{top:82%}}
.scanner p{color:#fff;margin:0;text-align:center}
.scanner .row{width:min(88vw,420px)}
.scanner .btn{flex:1}

/* ---------- wash touches & motion ---------- */
.hero{position:relative;background:linear-gradient(180deg,#C9EFFA 0%,#E3F6FC 58%,var(--bg) 100%);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.heroin{position:relative;max-width:1120px;margin:0 auto;padding-block:18px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wave{display:block;width:100%;height:30px;position:relative}
.wrap{padding-block:4px 40px}
.top .logo{box-shadow:0 6px 16px rgba(92,211,240,.45)}
.roles{box-shadow:0 6px 18px rgba(10,37,64,.06)}
.roles button{transition:background .25s ease,color .25s ease}
.sound{border:1px solid var(--line);background:rgba(255,255,255,.75);width:44px;height:44px;border-radius:12px;cursor:pointer;display:grid;place-items:center;color:var(--brand)}
.btn{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.aqua{box-shadow:0 10px 22px rgba(43,166,207,.28)}
.btn.primary{box-shadow:0 10px 22px rgba(10,37,64,.18)}
.panel{box-shadow:0 1px 2px rgba(10,37,64,.04),0 10px 26px rgba(10,37,64,.05)}
.kpi{box-shadow:0 1px 2px rgba(10,37,64,.04),0 8px 20px rgba(10,37,64,.04);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;left:-22px;bottom:-30px;background:radial-gradient(circle,rgba(92,211,240,.22),transparent 70%)}
#view.enter .col>*,#view.enter .kpis>*,#view.enter .dash .stack>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter .col>*:nth-child(2),#view.enter .kpis>*:nth-child(2),#view.enter .dash .stack>*:nth-child(2){animation-delay:.06s}
#view.enter .col>*:nth-child(3),#view.enter .kpis>*:nth-child(3),#view.enter .dash .stack>*:nth-child(3){animation-delay:.12s}
#view.enter .col>*:nth-child(n+4),#view.enter .kpis>*:nth-child(4),#view.enter .dash .stack>*:nth-child(n+4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pass{position:relative}
.pass .gloss{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.16) 47%,rgba(255,255,255,.04) 52%,transparent 60%);transform:translateX(-130%);animation:gloss 7s ease-in-out 1s infinite}
@keyframes gloss{0%{transform:translateX(-130%)}30%,100%{transform:translateX(130%)}}
.stamp{position:relative}
.splash{position:absolute;inset:-5px;border-radius:12px;border:2px solid #9FE6F7;animation:splash .9s ease-out both;pointer-events:none}
@keyframes splash{from{opacity:1;transform:scale(.5)}to{opacity:0;transform:scale(1.7)}}
.washcar{position:relative}
.washcar .dr{position:absolute;top:-4px;width:3px;height:9px;border-radius:2px 2px 4px 4px;background:#BFF0FB;opacity:0}
.washcar.wet .dr{animation:rain .9s ease-in 3}
.washcar.wet svg{animation:shine 2.2s ease .4s}
@keyframes rain{0%{opacity:0;transform:translateY(0)}15%{opacity:.95}100%{opacity:0;transform:translateY(54px)}}
@keyframes shine{0%,100%{filter:none}55%{filter:brightness(1.3) drop-shadow(0 0 8px rgba(92,211,240,.9))}}
.stage svg path{transition:fill .45s ease}
.track .s .c{transition:background .3s ease,border-color .3s ease}
.track .s.now .c{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(92,211,240,.55)}50%{box-shadow:0 0 0 9px rgba(92,211,240,0)}}
.track .ln{position:relative;overflow:hidden}
.track .ln.on{background:var(--aqua)}
.fx{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;background:rgba(237,247,251,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s ease}

function lum(hex){var n=parseInt(String(hex).slice(1),16);return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;}

function carSvg(type,color,w,h,label){

  var m=members[sel]; if(!m) return; var w=waitMin(m); if(w){ toast('ما ينفع ختمين خلال '+gapLabel()+'. باقي '+waitLabel(w)); render(); return; }
  m=JSON.parse(JSON.stringify(m)); var now=new Date().toISOString();
  m.stamps=Math.min(need(),(m.stamps||0)+1); m.total=(m.total||0)+1; m.visits=(m.visits||[]).concat([now]).slice(-10); m.pendingRating=now; m.lastStaff=staffName;
  putMember(m).then(function(){return putFeed('ختم لـ '+m.name,staffName,true);});
  sfx('splash'); celebrate(m.stamps>=need()?'اكتملت البطاقة':'انضاف الختم', m.name.split(' ')[0]+' · '+m.stamps+' من '+need(), m.stamps>=need()?'gift':''); toast(m.stamps>=need()?'اكتملت بطاقة '+m.name.split(' ')[0]+'. المكافأة جاهزة':'تم. '+m.name.split(' ')[0]+' صار عنده '+m.stamps+' من '+need());
  
}
function pay(method){
  var m=members[meId]; if(!m||paying) return;
  var pk=PKGS.filter(function(x){return x[0]===ord.pkg;})[0], items=[[pk[1],pk[3]]];
  ADDONS.forEach(function(a){ if(ord.addons.indexOf(a[0])>-1) items.push([a[1],a[2]]); });
  var total=items.reduce(function(s,i){return s+i[1];},0), now=new Date(), id='o'+now.getTime().toString(36);
  var no='INV-'+dayKey(now).slice(2).replace(/-/g,'')+'-'+String(now.getTime()).slice(-4);
  paying=true; render();
  setTimeout(function(){
    var o={id:id,no:no,member:m.id,name:m.name,phone:m.phone,car:m.type,items:items,total:total,method:method,status:'paid',at:now.toISOString()};
    myOrderSeen[id]='paid'; paying=false; curOrder=id; custView='invoice';
    putOrder(o).then(function(){return putFeed('طلب مدفوع '+no+' · '+money(total)+' من '+m.name,'',false);});
    render(); sfx('chime'); celebrate('تم الدفع',money(total)+' · فاتورتك جاهزة'); toast('تم الدفع '+money(total)+'. فاتورتك جاهزة');
  },1300);
}
function setOrderStatus(id,st){
  var o=orders.filter(function(x){return x.id===id;})[0]; if(!o) return; o=JSON.parse(JSON.stringify(o)); o.status=st; o.by=staffName;
  if(st==='done') o.doneAt=new Date().toISOString();
  putOrder(o);
  if(st==='done'&&members[o.member]&&waitMin(members[o.member])){
    putFeed('غسيل '+o.no+' جاهز · بدون ختم (أخذ ختم قبل أقل من '+gapLabel()+')',staffName,false);
    toast('الطلب جاهز. ما انضاف ختم لأن آخر ختم له قبل أقل من '+gapLabel());  return;
  }
  if(st==='done'&&members[o.member]){
    var m=JSON.parse(JSON.stringify(members[o.member])), now=new Date().toISOString();
    m.stamps=Math.min(need(),(m.stamps||0)+1); m.total=(m.total||0)+1; m.visits=(m.visits||[]).concat([now]).slice(-10); m.pendingRating=now; m.lastStaff=staffName;
    putMember(m).then(function(){return putFeed('غسيل '+o.no+' جاهز · ختم لـ '+m.name,staffName,true);});
    sfx('splash'); celebrate('السيارة جاهزة','انضاف ختم لـ '+m.name.split(' ')[0]); toast('جاهزة. انضاف ختم لـ '+m.name.split(' ')[0]+' ووصله طلب التقييم');
  } else { sfx('spray'); toast('بدأ غسيل طلب '+o.no); }
  
}
function sendRating(){
  var m=members[meId]; if(!m||!rd.stars) return;
  var r={id:'r'+Date.now().toString(36),member:m.id,name:m.name,phone:m.phone,stars:rd.stars,tags:rd.tags.slice(),note:(rd.note||'').trim().slice(0,300),by:m.lastStaff||'',visit:m.pendingRating,at:new Date().toISOString()};
  var mm=JSON.parse(JSON.stringify(m)); delete mm.pendingRating; mm.thanks=rd.stars;
  sfx('chime'); putRating(r).then(function(){return putMember(mm);}).then(function(){return putFeed('تقييم '+starsTxt(r.stars)+' من '+m.name,'',false);});
  members[m.id]=mm; rd={stars:0,tags:[],note:''}; render();
  setTimeout(function(){var x=members[meId]; if(x&&x.thanks){var y=JSON.parse(JSON.stringify(x)); delete y.thanks; putMember(y);}},12000);
}
function skipRating(){ var m=members[meId]; if(!m) return; var mm=JSON.parse(JSON.stringify(m)); delete mm.pendingRating; members[m.id]=mm; putMember(mm); render(); }
function redeem(){
  var m=members[sel]; if(!m) return; m=JSON.parse(JSON.stringify(m)); m.stamps=0; m.rewards=(m.rewards||0)+1;
  putMember(m).then(function(){return putFeed('سلّم غسلة مجانية لـ '+m.name,staffName,false);}); sfx('chime'); celebrate('سلّمت المكافأة',m.name.split(' ')[0]+' بدأ بطاقة جديدة','gift'); toast('سلّمت '+m.name.split(' ')[0]+' غسلته المجانية'); 
}
$('cam').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  scanMsg='جاري قراءة الكود…'; render();
  decodeImage(f).then(function(txt){
    var id=String(txt).indexOf(QR_PREFIX)===0?txt.slice(QR_PREFIX.length):txt;
    if(members[id]){ openMember(id); } else { scanMsg='هذا الكود مو لبطاقة لمعة'; render(); }
  },function(why){ scanMsg=why==='lib'?'قارئ الكود ما اشتغل، استخدم البحث':'ما لقيت كود في الصورة. قرّب الكاميرا وخل الكود واضح'; render(); });
});
var stream=null, scanning=false, cv=document.createElement('canvas');
function stopScan(){ scanning=false; if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } $('scanner').hidden=true; }
function photoFallback(){ stopScan(); $('cam').value=''; $('cam').click(); }
function gotCode(txt){
  var id=String(txt).indexOf(QR_PREFIX)===0?String(txt).slice(QR_PREFIX.length):String(txt);
  stopScan(); if(navigator.vibrate) try{navigator.vibrate(60);}catch(e){}
  if(members[id]) openMember(id); else { scanMsg='هذا الكود مو لبطاقة لمعة'; render(); }
}
function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof window.jsQR!=='function'){ photoFallback(); return; }
  $('scanner').hidden=false; $('scanTip').textContent='وجّه الكاميرا على الـ QR اللي في بطاقة الزبون';
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
    stream=s; var v=$('vid'); v.srcObject=s; v.setAttribute('playsinline',''); return v.play();
  }).then(function(){ scanning=true; tick(); }).catch(function(){ $('scanTip').textContent='ما قدرنا نفتح الكاميرا. اسمح للمتصفح بالكاميرا، أو صوّر الكود بدلها'; });
}
function tick(){
  if(!scanning) return; var v=$('vid');
  if(v.readyState>=2&&v.videoWidth){
    var w=480, h=Math.round(v.videoHeight*w/v.videoWidth); cv.width=w; cv.height=h; var x=cv.getContext('2d',{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
    var r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); if(r&&r.data){ gotCode(r.data); return; }
  }
  requestAnimationFrame(tick);
}
$('scanClose').addEventListener('click',stopScan);
$('scanPhoto').addEventListener('click',photoFallback);

/* ---------- motion, bubbles & sound ---------- */
var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches, lastViewKey='';
var DROPS=[8,24,44,64,86,108].map(function(x,i){return '<span class="dr" style="left:'+x+'px;animation-delay:'+(i*0.13).toFixed(2)+'s"></span>';}).join('');
function countUp(){
  document.querySelectorAll('.kpi .n').forEach(function(el){
    var t=el.textContent, mm=t.match(/^(\d+(?:\.\d+)?)/); if(!mm) return; var end=parseFloat(mm[1]), dec=(mm[1].split('.')[1]||'').length, rest=el.innerHTML.slice(mm[1].length), t0=performance.now();
    (function step(n){ var p=Math.min(1,(n-t0)/700), e=1-Math.pow(1-p,3); el.innerHTML=(end*e).toFixed(dec)+rest; if(p<1) requestAnimationFrame(step); })(t0);
  });
}
/* bubbles in the header */
(function(){
  var c=$('bub'); if(!c||REDUCED) return; var x=c.getContext('2d'), B=[], W=0, H=0, dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){ W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  function mk(y){ return {x:Math.random()*W, y:y==null?H+20:y, r:3+Math.random()*10, s:.15+Math.random()*.35, w:Math.random()*6.28, a:.25+Math.random()*.35}; }
  size(); for(var i=0;i<Math.max(10,Math.round(W/70));i++) B.push(mk(Math.random()*H));
  window.addEventListener('resize',size);
  (function loop(){
    if(!document.hidden){
      x.clearRect(0,0,W,H);
      B.forEach(function(b,i){ b.y-=b.s; b.w+=.02; var bx=b.x+Math.sin(b.w)*6; if(b.y<-20) B[i]=mk();
        x.beginPath(); x.arc(bx,b.y,b.r,0,6.283); x.fillStyle='rgba(255,255,255,'+(b.a*.55)+')'; x.fill(); x.lineWidth=1.2; x.strokeStyle='rgba(43,166,207,'+b.a+')'; x.stroke();
        x.beginPath(); x.arc(bx-b.r*.35,b.y-b.r*.35,b.r*.22,0,6.283); x.fillStyle='rgba(255,255,255,.9)'; x.fill(); });
    }
    requestAnimationFrame(loop);
  })();
})();
/* sound effects (generated, no files) */
var AC=null, muted=false; try{muted=localStorage.getItem('lamaa-mute')==='1';}catch(e){}
function ac(){ if(muted) return null; try{ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==='suspended') AC.resume(); }catch(e){ return null; } return AC; }
function tone(f1,f2,dur,type,vol,at){ var a=ac(); if(!a) return; var t=a.currentTime+(at||0), o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02); }
function noise(dur,freq,vol,at){ var a=ac(); if(!a) return; var t=a.currentTime+(at||0), n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  var s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=buf; f.type='bandpass'; f.frequency.value=freq||1800; f.Q.value=.8; g.gain.value=vol||.25; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }
var SFX={
  tap:function(){ tone(900,700,.05,'sine',.05); },
  pop:function(){ tone(520,1250,.09,'sine',.12); },
  splash:function(){ noise(.45,1500,.28); tone(500,1300,.08,'sine',.08,.12); tone(650,1500,.08,'sine',.07,.24); tone(420,1100,.08,'sine',.06,.34); },
  chime:function(){ tone(880,0,.35,'sine',.12); tone(1320,0,.45,'sine',.1,.12); tone(1760,0,.5,'sine',.07,.24); },
  beep:function(){ tone(1150,0,.08,'square',.05); tone(1550,0,.1,'square',.05,.09); },
  spray:function(){ noise(.9,3200,.18); }
};
function sfx(n){ if(!muted&&SFX[n]) try{SFX[n]();}catch(e){} }
function sndIcon(){ var b=$('snd'); if(!b) return; b.setAttribute('aria-pressed',String(!muted)); b.innerHTML=muted?'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>':'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>'; b.setAttribute('aria-label',muted?'تشغيل الأصوات':'كتم الأصوات'); }
$('snd').addEventListener('click',function(){ muted=!muted; try{localStorage.setItem('lamaa-mute',muted?'1':'0');}catch(e){} sndIcon(); if(!muted) sfx('pop'); });
sndIcon();
/* celebration overlay */
function celebrate(title,sub,kind){
  var fx=$('fx'); if(!fx) return;
  var icon=kind==='gift'?'<path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>':'<path d="M5 12.5l4.5 4.5L19 7.5"/>';
  var bb=''; if(!REDUCED) for(var i=0;i<16;i++){ var ang=Math.random()*6.283, dist=90+Math.random()*120, r=8+Math.random()*18; bb+='<span class="bb" style="width:'+r+'px;height:'+r+'px;--dx:'+Math.round(Math.cos(ang)*dist)+'px;--dy:'+Math.round(Math.sin(ang)*dist-40)+'px;animation-delay:'+(Math.random()*.25).toFixed(2)+'s"></span>'; }
  fx.innerHTML=bb+'<div class="ring"><svg class="ck" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0A2540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+icon+'</svg></div><b>'+esc(title)+'</b>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'');
  fx.classList.add('show'); clearTimeout(celebrate._t); celebrate._t=setTimeout(function(){ fx.classList.remove('show'); },1500);
}
document.addEventListener('click',function(e){ var b=e.target.closest('.roles button,.types button,.colors button,.pkg,.tags button,.filters button,.seg button,.keypad button'); if(b) sfx('tap'); },true);
connect();
})();
