<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D1D1F">
<title>حسابي · شاهين ديزاين</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/apps/kit.css?v=2">
<style>
:root{--accent:#8C6A36;--accent-ink:#fff;--bg:#F5F3EF}
.mark{width:42px;height:42px;border-radius:13px;background:var(--house-ink);color:var(--gold-l);display:grid;place-items:center;font-family:var(--display);font-weight:600;flex-shrink:0}
.brandhead{border-radius:var(--r-lg);padding:26px 22px;background:radial-gradient(120% 120% at 100% 0%,rgba(184,147,90,.38),transparent 55%),var(--house-ink);color:#F5F0E8;position:relative;overflow:hidden}
.brandhead h1{color:#F5F0E8;font-size:24px}.brandhead p{color:#C9BFAF;font-size:14px;margin-top:4px}
.field{position:relative}.field input{width:100%}.field .eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.pre{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.pre span{background:var(--surface2);color:var(--muted);padding:0 10px;display:flex;align-items:center;font-size:13px;direction:ltr;border-inline-start:1px solid var(--line)}.pre input{border:0!important;border-radius:0!important;flex:1;min-width:0}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plan{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:border-color var(--t-fade),transform var(--t-press)}
.plan:active{transform:scale(.98)}.plan[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.plan b{font-family:var(--display);font-size:14.5px;line-height:1.35}.plan .num{font-size:18px;color:var(--accent)}
.sum{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.paybox:empty{display:none}
.pay-stage{text-align:center;padding:30px 20px}.pay-stage .ring{width:86px;height:86px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
.pay-stage .ring path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw var(--t-draw) var(--e-out) .15s forwards}
.tabsbar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabsbar a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:9px 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabsbar a[aria-current=page]{background:var(--house-ink);color:var(--gold-l)}
.dring{--p:50;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex-shrink:0;transition:--p .6s}
.dring b{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:22px;line-height:1.05;text-align:center}.dring small{display:block;font-size:11px;color:var(--muted);font-family:var(--body)}
/* الفاتورة */
.inv{max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:26px 22px 34px;box-shadow:var(--sh-2);position:relative;
 -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/18px 100% repeat-x}
.inv .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.inv .ttl{font-family:var(--display);font-size:22px;font-weight:600}.inv .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);direction:ltr;text-align:end;white-space:nowrap}
.inv .rule{border:0;border-top:1px solid color-mix(in srgb,var(--gold) 50%,transparent);margin:16px 0}
.inv .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.inv .meta small{display:block;font-size:11.5px;color:var(--muted)}.inv .meta div{font-size:14.5px}
.inv table{width:100%;border-collapse:collapse;font-size:14px}.inv td,.inv th{padding:9px 0;border-bottom:1px solid var(--line2);text-align:start}.inv th{font-size:12px;color:var(--muted);font-weight:600}.inv td.num,.inv th.num{text-align:end}
.inv .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}.inv .tot b{font-family:var(--display);font-size:32px;font-weight:600}.inv .tot b small{font-size:15px;margin-inline-start:4px}
.stamp{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ok);color:var(--ok);border-radius:10px;padding:4px 12px;font-weight:700;transform:rotate(-4deg);font-family:var(--display)}
.stamp.test{border-color:var(--warn);color:var(--warn)}
@media print{@page{size:A4;margin:14mm}body{background:#fff}.noprint,.toast{display:none!important}.wrap{padding:0;max-width:none}.inv{box-shadow:none;-webkit-mask:none;mask:none;max-width:none;padding:0;color:#000}}
.menu-av{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="col" style="margin-top:20vh"><div class="skeleton"></div></div></div>
<script src="/apps/icons.js?v=2"></script>
<script src="/vendor/qrcode.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return MAP[c]; }); };
  var ic = window.KI.ic;
  var LS = { get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  var WA = '966582409776';
  var KIND_IC = { cafe: 'cup', salon: 'scissors', clinic: 'steth', aftersales: 'home', hr: 'user', bio: 'link', invite: 'mail' };
  var S = { me: null, plans: null, admin: null, made: null, ck: { kind: '', period: 'm', step: 1 }, cur: LS.get('sd-cur', ''), checked: false };
  var STATUS = { active: ['فعّال', 'ok'], grace: ['فترة سماح', 'warn'], expired: ['منتهي', 'bad'], invited: ['بانتظار التفعيل', 'warn'], suspended: ['موقوف', 'bad'] };

  function api(path, body) {
    return fetch('/api/platform/' + path, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw { status: r.status, error: j.error || 'صار خطأ، جرّب مرة ثانية' }; return j; }); });
  }
  function toast(m) { var t = document.querySelector('.toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3500); }
  function sheet(html) { closeSheet(); var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); }); document.body.appendChild(bg); }
  function closeSheet() { var s = document.querySelector('.sheet-bg'); if (s) s.remove(); }
  function sar(h) { var v = h / 100; return v.toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function money(h) { return '<span class="num">' + sar(h) + '</span> ر.س'; }
  function qr(text) { var q = qrcode(0, 'M'); q.addData(text); q.make(); var n = q.getModuleCount(), p = ''; for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) p += 'M' + c + ' ' + r + 'h1v1h-1z'; return '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + p + '" fill="#1C1A18"/></svg>'; }
  function dateAr(iso, o) { try { return new Date(Date.parse(iso) + 3 * 36e5).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', Object.assign({ day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }, o || {})); } catch (e) { return iso; } }
  function daysLeft(iso) { return Math.ceil((Date.parse(iso) - Date.now()) / 864e5); }
  function busy(btn, on) { if (btn) { if (on) btn.setAttribute('aria-busy', 'true'); else btn.removeAttribute('aria-busy'); } }
  var top = function (sub, menu) { return '<header class="top"><a class="brand" href="/" style="text-decoration:none;color:inherit"><div class="mark">ش</div><div><b>شاهين ديزاين</b><small>' + E(sub) + '</small></div></a>' + (menu ? '<button class="menu-av" data-x="menu" aria-label="حسابي">' + ic('user', 20) + '</button>' : '') + '</header>'; };
  function route() { var h = (location.hash || '').slice(1).split('/'); return { name: h[0] || '', arg: decodeURIComponent(h[1] || '') }; }

  // ---------- الدخول ----------
  function vLogin(msg) {
    var bySlug = S.bySlug;
    return top('حساب المشترك') + '<div class="col">' +
      '<div class="brandhead"><h1>أهلًا فيك من جديد</h1><p>ادخل لحساب نظامك</p></div>' +
      '<form class="panel stack" id="login" novalidate>' + (msg ? '<div class="chip ok" style="align-self:flex-start">' + E(msg) + '</div>' : '') +
      (bySlug ? '<label class="f">اسم الحساب<div class="pre"><input name="id" class="ltr" required autocomplete="username" autocapitalize="off" placeholder="sana-cafe"><span>shaheendesign.sa/s/</span></div></label>'
              : '<label class="f">رقم جوالك<input name="id" inputmode="tel" class="ltr" required autocomplete="username" placeholder="05xxxxxxxx"></label>') +
      '<label class="f">كلمة المرور<div class="field"><input name="password" type="password" required autocomplete="current-password"><button type="button" class="eye" data-x="eye" aria-label="إظهار كلمة المرور">' + ic('eye', 20) + '</button></div></label>' +
      '<p class="err" id="err" role="alert" hidden></p><button class="btn" id="loginBtn">دخول</button>' +
      '<div class="row between small"><a href="#" data-x="bySlug">' + (bySlug ? 'ادخل برقم جوالك' : 'أو ادخل باسم الحساب') + '</a><a href="#forgot">نسيت كلمة المرور؟</a></div></form>' +
      '<a class="panel item" href="#start" style="text-decoration:none;color:inherit"><div class="av">' + ic('spark') + '</div><div class="grow"><b>ما عندك حساب؟</b><div class="small muted">اختر نظامك واشترك، وحسابك يجهز في نفس اللحظة</div></div>' + ic('arrow', 18) + '</a>' +
      '<p class="foot"><a href="/demos">جرّب الأنظمة حيّة</a></p></div>';
  }
  function vForgot() {
    var msg = 'السلام عليكم، أبي أغيّر كلمة المرور لحسابي في منصة شاهين';
    return top('استعادة كلمة المرور') + '<div class="col"><div class="panel stack"><div class="av" style="width:52px;height:52px">' + ic('lock', 24) + '</div><h2>نسيت كلمة المرور؟</h2><p class="muted">راسلنا من نفس رقم الجوال المسجّل بالحساب، ونرسل لك رابط تختار منه كلمة مرور جديدة. ما نطلب منك كلمة المرور القديمة أبدًا.</p><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent(msg) + '">' + ic('mail', 18) + 'راسلنا واتساب</a><a class="btn ghost" href="#">رجوع للدخول</a></div></div>';
  }
  function vActivate() {
    return top('تفعيل الحساب') + '<div class="col"><div class="brandhead"><h1>فعّل حسابك</h1><p>اختر كلمة مرور، وبتدخل فيها كل مرة</p></div><form class="panel stack" id="act"><input type="text" name="username" autocomplete="username" hidden><label class="f">كلمة المرور<div class="field"><input name="password" type="password" minlength="8" required autocomplete="new-password"><button type="button" class="eye" data-x="eye" aria-label="إظهار كلمة المرور">' + ic('eye', 20) + '</button></div></label><label class="f">أعد كتابتها<input name="password2" type="password" minlength="8" required autocomplete="new-password"></label><p class="err" id="err" role="alert" hidden></p><button class="btn">تفعيل ودخول</button></form></div>';
  }

  // ---------- الاشتراك ----------
  function planList() { var p = S.plans.plans; return Object.keys(p).map(function (k) { return [k, p[k]]; }); }
  function vStart() {
    var ck = S.ck, P = S.plans, logged = S.me && S.me.account && S.me.account.kind === 'p';
    if (!P) return top('اشتراك جديد') + '<div class="col"><div class="skeleton"></div></div>';
    var cur = P.plans[ck.kind], price = cur ? cur[ck.period] : 0;
    var h = top('اشتراك جديد', !!S.me) + '<div class="col"><div class="steps" aria-label="الخطوة ' + ck.step + ' من ٣"><i class="on"></i><i class="' + (ck.step > 1 ? 'on' : '') + '"></i><i class="' + (ck.step > 2 ? 'on' : '') + '"></i></div>';
    if (P.mode === 'test') h += '<div class="panel soft small row" style="gap:8px">' + ic('alert', 18) + '<span><b>وضع تجريبي:</b> الدفع وهمي، والحساب يشتغل يوم واحد للتجربة.</span></div>';
    if (ck.step === 1) {
      h += '<div class="panel stack"><h2>اختر نظامك</h2><div class="seg" role="group"><button type="button" data-x="period" data-v="m" aria-pressed="' + (ck.period === 'm') + '">شهري</button><button type="button" data-x="period" data-v="y" aria-pressed="' + (ck.period === 'y') + '">سنوي · شهرين مجانًا</button></div>' +
        '<div class="plans">' + planList().map(function (x) { return '<button type="button" class="plan" data-x="kind" data-v="' + x[0] + '" aria-pressed="' + (ck.kind === x[0]) + '"><span class="av" style="width:36px;height:36px">' + ic(KIND_IC[x[0]] || 'spark', 20) + '</span><b>' + E(x[1].title) + '</b><span>' + money(x[1][ck.period]) + '<span class="tiny muted"> / ' + (ck.period === 'y' ? 'سنة' : 'شهر') + '</span></span></button>'; }).join('') + '</div>' +
        '<a class="small" href="https://wa.me/' + WA + '?text=' + encodeURIComponent('أبي دعوات إلكترونية لمناسبتي') + '" target="_blank" rel="noopener">تبي دعوات إلكترونية لمناسبة؟ نسعّرها لك حسب عدد الضيوف</a>' +
        '<button class="btn" data-x="next"' + (ck.kind ? '' : ' disabled') + '>التالي</button></div>';
    } else if (ck.step === 2) {
      h += '<form class="panel stack" id="ck2"><h2>اسم نشاطك ورابطه</h2><label class="f">اسم النشاط<input name="name" required maxlength="40" value="' + E(ck.name || '') + '" placeholder="مثلًا: مقهى ورد"></label>' +
        '<label class="f">رابط صفحتك<div class="pre"><input name="slug" class="ltr" required maxlength="31" autocapitalize="off" autocomplete="off" value="' + E(ck.slug || '') + '" placeholder="ward-cafe"><span>shaheendesign.sa/s/</span></div><span class="small" id="slugMsg" aria-live="polite"></span></label>' +
        '<p class="tiny muted">إنجليزي صغير وأرقام وشرطة. هذا الرابط اللي بتشاركه مع عملائك.</p><p class="err" id="err" role="alert" hidden></p><div class="grid2"><button type="button" class="btn ghost" data-x="back">رجوع</button><button class="btn">التالي</button></div></form>';
    } else {
      h += '<form class="panel stack" id="ck3"><h2>' + (logged ? 'تأكيد الاشتراك' : 'رقمك وكلمة المرور') + '</h2>' +
        (logged ? '<p class="muted small">بينضاف النظام لحسابك ' + E(S.me.account.phone) + '</p>' :
        '<label class="f">رقم جوالك<input name="phone" inputmode="tel" class="ltr" required autocomplete="username" placeholder="05xxxxxxxx" value="' + E(ck.phone || '') + '"><span class="tiny muted">تدخل فيه حسابك، ونرسل لك عليه الفاتورة وتنبيه التجديد</span></label>' +
        '<label class="f">كلمة المرور<div class="field"><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="٨ حروف أو أكثر"><button type="button" class="eye" data-x="eye" aria-label="إظهار كلمة المرور">' + ic('eye', 20) + '</button></div></label>') +
        '<div class="sum stack tight"><div class="row between"><span>' + E(cur ? cur.title : '') + '</span><b>' + money(price) + '</b></div><div class="row between small muted"><span>' + (ck.period === 'y' ? 'سنة كاملة' : 'شهر') + ' · shaheendesign.sa/s/' + E(ck.slug) + '</span><span>' + (S.plans.vat ? 'شامل الضريبة' : '') + '</span></div></div>' +
        '<p class="tiny muted">إذا ما ناسبك خلال ٧ أيام، نرجّع لك فلوسك كاملة. التجديد يدوي وما نسحب من بطاقتك شي بدون علمك.</p>' +
        '<p class="err" id="err" role="alert" hidden></p><div class="paybox" id="paybox"></div><div id="ckBtns" style="display:grid;grid-template-columns:1fr 2fr;gap:10px"><button type="button" class="btn ghost" data-x="back">رجوع</button><button class="btn" id="payBtn">' + ic('lock', 18) + 'ادفع ' + sar(price) + ' ر.س</button></div></form>';
    }
    return h + '<p class="foot"><a href="/demos">جرّب الأنظمة قبل</a> · <a href="https://wa.me/' + WA + '" target="_blank" rel="noopener">عندك سؤال؟</a></p></div>';
  }

  // ---------- الدفع (ميسّر أو تجريبي) ----------
  function loadMoyasar() {
    if (window.Moyasar) return Promise.resolve();
    return new Promise(function (res, rej) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/vendor/moyasar.css'; document.head.appendChild(l); var sc = document.createElement('script'); sc.src = '/vendor/moyasar.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  }
  function showPay(j) {
    LS.set('sd-checkout', { co: j.co.id, at: Date.now(), title: j.co.title });
    var box = $('paybox'), btns = $('ckBtns'); if (btns) btns.hidden = true;
    if (j.mode === 'test') {
      box.innerHTML = '<div class="panel flat stack" style="border-style:dashed"><div class="row between"><b class="row" style="gap:8px">' + ic('card', 20) + 'دفع تجريبي</b><span class="chip warn">وضع تجريبي</span></div><p class="small muted">مفاتيح ميسّر لسا ما انضافت، فهذا دفع وهمي يجرب الرحلة كاملة بدون فلوس.</p><button type="button" class="btn" data-x="simpay" data-co="' + E(j.co.id) + '">ادفع ' + sar(j.amount) + ' ر.س (تجربة)</button></div>';
      return;
    }
    box.innerHTML = '<div id="mysr"></div>';
    loadMoyasar().then(function () {
      window.Moyasar.init({ element: '#mysr', amount: j.amount, currency: 'SAR', description: j.description, publishable_api_key: j.pk, given_id: j.given_id,
        callback_url: location.origin + '/app?paid=' + encodeURIComponent(j.co.id), methods: ['creditcard', 'applepay'], supported_networks: ['mada', 'visa', 'mastercard'], metadata: { kind: 'sub', co: j.co.id },
        apple_pay: { country: 'SA', label: 'Shaheen Design', validate_merchant_url: 'https://api.moyasar.com/v1/applepay/initiate' } });
    }, function () { box.innerHTML = '<p class="err">ما قدرنا نحمّل صفحة الدفع، حدّث الصفحة</p>'; });
  }

  // ---------- الرجوع بعد الدفع ----------
  var payState = { tries: 0, timer: null };
  function vPay(st) {
    var co = st && st.co, h = top('الدفع') + '<div class="col"><div class="panel pay-stage" aria-live="polite">';
    if (!st || st.status === 'checking') h += '<div class="ring wait"></div><h2>لحظة، نتأكد من الدفع…</h2><p class="muted small" style="margin-top:6px">نتأكد مباشرة من ميسّر، لا تقفل الصفحة</p>';
    else if (st.status === 'paid') {
      h += '<div class="ring">' + ic('check', 40, 2.6) + '</div><h2>تم الاشتراك</h2><p class="muted" style="margin-top:4px">' + E(co.title) + ' فعّال لين ' + E(dateAr(co.until)) + '</p>' +
        (co.renamed ? '<p class="chip warn" style="margin-top:10px">الرابط اللي اخترته انحجز أثناء الدفع، وصار رابطك: ' + E(co.slug) + '</p>' : '') +

  function confirmPay(co, sim) {
    clearTimeout(payState.timer);
    return api('pay/confirm', { co: co, sim: !!sim }).then(function (j) {
      if (j.status === 'paid') {
        LS.del('sd-checkout');
        var done = function (signed) { j.signedIn = signed; $('app').innerHTML = vPay(j); wire(); try { navigator.vibrate && navigator.vibrate([20, 40, 20]); } catch (e) {} };
        if (j.loggedIn) return loadMe().then(function () { done(true); }, function () { done(false); });
        return loadMe().then(function () { done(!!S.me); }, function () { done(false); });
      }
      if (j.status === 'failed') { $('app').innerHTML = vPay(j); wire(); return; }
      payState.tries++;
      if (payState.tries < 8) { if (payState.tries > 2) { $('app').innerHTML = vPay({ status: 'pending', co: j.co }); wire(); } payState.timer = setTimeout(function () { confirmPay(co); }, Math.min(2000 * payState.tries, 6000)); }
      else { $('app').innerHTML = vPay({ status: 'pending', co: j.co }); wire(); }
    }, function (e) { $('app').innerHTML = vPay({ status: 'pending', co: { id: co, title: '' } }); wire(); toast(e.error); });
  }

        (t.status === 'suspended' ? '<button class="btn xs soft" data-x="resume" data-slug="' + E(t.slug) + '">تشغيل</button>' : '<button class="btn xs danger" data-x="suspend" data-slug="' + E(t.slug) + '">إيقاف</button>') + (t.self ? '' : '<button class="btn xs ghost" data-x="code" data-slug="' + E(t.slug) + '">' + (t.activated ? 'استعادة كلمة المرور' : 'رابط تفعيل') + '</button>') + '</div></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">ما فيه مشتركين لسا.</div>') + '</section>';
    html += '<div class="stack"><form class="panel stack" id="create"><h2>اشتراك يدوي</h2><p class="tiny muted">للعملاء اللي يدفعون تحويل أو كاش. تقدر تسجل الدفعة بعدها من زر «دفعة» عشان تطلع فاتورة.</p><label class="f">اسم النشاط<input name="name" required maxlength="40" placeholder="مقهى سنا"></label><label class="f">النظام<select name="kind">' + Object.keys(kinds).map(function (k) { return '<option value="' + k + '">' + E(kinds[k]) + '</option>'; }).join('') + '</select></label><label class="f">الرابط<input name="slug" required class="ltr" placeholder="sana-cafe" pattern="[a-z][a-z0-9\\-]{2,30}"></label><label class="f">جوال صاحب النشاط<input name="phone" inputmode="tel" class="ltr" placeholder="05xxxxxxxx"></label><label class="f">المدة<select name="months"><option value="1">شهر</option><option value="3">٣ أشهر</option><option value="6">٦ أشهر</option><option value="12">سنة</option></select></label><label class="f">ملاحظة<input name="note" maxlength="200"></label><p class="err" id="err" role="alert" hidden></p><button class="btn">إنشاء</button></form>' + (S.made ? madeBox(S.made) : '') +
      (a.month.pays.length ? '<section class="panel"><h3>دفعات هذا الشهر</h3><div class="list small" style="margin-top:8px">' + a.month.pays.map(function (p) { return '<a class="row between" style="text-decoration:none;color:inherit" href="#invoice/' + E(p.no) + '"><span><span class="ltr">' + E(p.no) + '</span><div class="tiny muted">/s/' + E(p.slug) + ' · ' + E(p.method) + '</div></span><b class="num">' + sar(p.total) + '</b></a>'; }).join('') + '</div></section>' : '') + '</div></div></div>';
    return html;
  }
  function madeBox(m) {
    var link = location.origin + '/app?code=' + m.code, msg = 'أهلًا\nحسابك في نظام ' + m.tenant.name + ' من شاهين ديزاين جاهز.\nفعّله واختر كلمة المرور من هنا:\n' + link + '\n\nاسم الحساب: ' + m.tenant.slug + '\nالرابط صالح ١٤ يوم.';
    return '<div class="panel soft stack" id="made"><h3>رابط التفعيل لـ ' + E(m.tenant.name) + '</h3><p class="ltr small" style="word-break:break-all;background:#fff;padding:8px;border-radius:10px">' + E(link) + '</p><div class="row wrap2"><button class="btn sm" data-x="copy" data-v="' + E(link) + '">نسخ</button>' + (m.phone ? '<a class="btn sm ok" target="_blank" rel="noopener" href="https://wa.me/966' + E(m.phone.slice(1)) + '?text=' + encodeURIComponent(msg) + '">إرسال واتساب</a>' : '') + '</div></div>';
  }

  // ---------- التوجيه ----------
  function loadMe() { return api('me', { slug: S.cur }).then(function (m) { S.me = m; S.cur = m.tenant.slug; LS.set('sd-cur', S.cur); return m; }, function (e) { S.me = null; throw e; }); }
  function loadPlans() { if (S.plans) return Promise.resolve(S.plans); return fetch('/api/platform/plans', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) { S.plans = j; return j; }); }
  function render() {
    var app = $('app'), q = new URLSearchParams(location.search), r = route();
    closeSheet();
    if (q.get('paid')) { if (S.payStarted === q.get('paid')) return; S.payStarted = q.get('paid'); app.innerHTML = vPay(null); wire(); payState.tries = 0; if (!S.simPending) confirmPay(q.get('paid')); return; }
    if (q.get('code')) { app.innerHTML = vActivate(); return wire(); }
    if (r.name === 'admin') { app.innerHTML = vAdmin(); return wire(); }
    if (r.name === 'forgot') { app.innerHTML = vForgot(); return wire(); }
    if (r.name === 'start') {
      if (r.arg && S.ck.kind !== r.arg && S.ck.step === 1) S.ck.kind = r.arg;
      app.innerHTML = vStart(); wire(); if (!S.plans) loadPlans().then(render, function () { toast('ما قدرنا نجيب الأسعار'); }); return;
    }
    if (r.name === 'invoice') {
      app.innerHTML = vInvoice(null);
      api('invoice', { no: r.arg }).then(function (j) { app.innerHTML = vInvoice(j.invoice); wire(); }, function (e) { if (e.status === 401) { S.next = location.hash; app.innerHTML = vLogin('سجّل دخولك عشان تشوف الفاتورة'); wire(); } else app.innerHTML = top('فاتورة') + '<div class="col"><div class="empty">' + ic('receipt', 26) + E(e.error) + '</div></div>'; });
      return;
    }
    if (S.me) { app.innerHTML = vDash(['billing', 'account'].indexOf(r.name) >= 0 ? r.name : 'home'); wire(); if (r.name === 'billing' && !S.plans) loadPlans(); return; }
    if (!S.checked) return;
    app.innerHTML = vLogin(S.flash); S.flash = ''; wire();
  }
  function err(m) { var e = $('err'); if (e) { e.hidden = false; e.textContent = m; var p = e.closest('.panel'); if (p) { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); } } else toast(m); }
  function after(path) { history.replaceState(null, '', path); render(); }
  function startCheckout(body, btn) {
    busy(btn, true);
    return api('checkout', body).then(function (j) { busy(btn, false); showPay(j); }, function (x) { busy(btn, false); err(x.error); });
  }
  function wire() {
    var f;
    if ((f = $('login'))) f.onsubmit = function (e) { var f = e.currentTarget;
      e.preventDefault(); var d = Object.fromEntries(new FormData(f)), btn = f.querySelector('button:not([type=button])'); busy(btn, true);
      api('login', { id: String(d.id).trim(), password: d.password }).then(function () { return loadMe(); }).then(function () { busy(btn, false); var n = S.next || ''; S.next = ''; if (new URLSearchParams(location.search).get('paid')) { location.href = '/s/' + S.me.tenant.slug + '#owner'; return; } after('/app' + n); }, function (x) { busy(btn, false); err(x.error || 'ما قدرنا ندخلك'); });
    };
    if ((f = $('act'))) f.onsubmit = function (e) { var f = e.currentTarget;
      e.preventDefault(); var d = Object.fromEntries(new FormData(f)); if (d.password !== d.password2) return err('كلمتين المرور مو متطابقة');
      api('activate', { code: new URLSearchParams(location.search).get('code'), password: d.password }).then(function () { return loadMe(); }).then(function () { toast('تم تفعيل حسابك'); after('/app'); }, function (x) { err(x.error); });
    };
    if ((f = $('ck2'))) {
      var si = f.querySelector('[name=slug]'), tmr;
      si.addEventListener('input', function () { si.value = si.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); clearTimeout(tmr); var v = si.value, m = $('slugMsg'); if (v.length < 3) { m.textContent = ''; return; } tmr = setTimeout(function () { api('slug', { slug: v }).then(function (j) { if (si.value !== v) return; m.style.color = j.ok ? 'var(--ok)' : 'var(--danger)'; m.textContent = j.ok ? 'متاح' : (j.why || 'مأخوذ'); }); }, 300); });
      f.onsubmit = function (e) { var f = e.currentTarget; e.preventDefault(); var d = Object.fromEntries(new FormData(f)); if (String(d.name).trim().length < 2) return err('اكتب اسم نشاطك'); if (!/^[a-z][a-z0-9-]{2,30}$/.test(d.slug)) return err('الرابط يبدأ بحرف إنجليزي صغير، ومن ٣ حروف أو أكثر');
        api('slug', { slug: d.slug }).then(function (j) { if (!j.ok) return err(j.why || 'الرابط مأخوذ'); S.ck.name = d.name.trim(); S.ck.slug = d.slug; S.ck.step = 3; render(); window.scrollTo(0, 0); }, function (x) { err(x.error); }); };
    }
    if ((f = $('ck3'))) f.onsubmit = function (e) { var f = e.currentTarget;
      e.preventDefault(); var d = Object.fromEntries(new FormData(f)); if (d.phone) S.ck.phone = d.phone;
      startCheckout({ kind: S.ck.kind, period: S.ck.period, name: S.ck.name, slug: S.ck.slug, phone: d.phone, password: d.password, ref: LS.get('sd-ref', '') }, $('payBtn'));
    };
    if ((f = $('renew'))) f.onsubmit = function (e) { var f = e.currentTarget; e.preventDefault(); startCheckout({ renew: S.me.tenant.slug, period: S.renewPeriod || (S.me.tenant.plan && S.me.tenant.plan.period) || 'm' }, $('payBtn')); };
    if ((f = $('pw'))) f.onsubmit = function (e) { var f = e.currentTarget; e.preventDefault(); var d = Object.fromEntries(new FormData(f)); api('password', { old: d.old, password: d.password }).then(function () { toast('تغيّرت كلمة المرور، والأجهزة الثانية طلعت'); f.reset(); }, function (x) { toast(x.error); }); };
    if ((f = $('create'))) f.onsubmit = function (e) { var f = e.currentTarget; e.preventDefault(); var d = Object.fromEntries(new FormData(f)); d.months = Number(d.months);
      api('admin', Object.assign({ action: 'create' }, d)).then(function (j) { S.made = { code: j.code, tenant: j.tenant, phone: d.phone ? String(d.phone).replace(/\D/g, '').replace(/^966/, '0') : '' }; return loadAdmin(); }, function (x) { err(x.error); }); };
    document.querySelectorAll('select[data-x=extend]').forEach(function (b) { b.onchange = function () { if (!b.value) return; adminAct({ action: 'extend', slug: b.dataset.slug, months: Number(b.value) }, 'تم التمديد'); }; });
    var rc = LS.get('sd-checkout', null), app = $('app');
    if (rc && Date.now() - rc.at < 2 * 864e5 && !new URLSearchParams(location.search).get('paid') && route().name !== 'start' && !document.getElementById('rcb')) {
      var bn = document.createElement('div'); bn.id = 'rcb'; bn.className = 'panel soft row between wrap2 noprint'; bn.style.margin = '0 auto 12px'; bn.style.maxWidth = '920px';
      bn.innerHTML = '<span class="row" style="gap:8px">' + ic('card', 20) + '<b class="small">عندك دفعة اشتراك ما تأكدت · نتحقق منها؟</b></span><span class="row" style="gap:6px"><a class="btn sm" href="/app?paid=' + encodeURIComponent(rc.co) + '">تحقق</a><button class="btn sm ghost" data-x="dropco" aria-label="إخفاء">' + ic('x', 16) + '</button></span>';
      app.insertBefore(bn, app.children[1] || null);
    }
  }
  function adminAct(body, msg) { api('admin', body).then(function () { toast(msg); loadAdmin(); }, function (e) { toast(e.error); }); }
  function loadAdmin() { return api('admin', { action: 'list' }).then(function (j) { S.admin = j; render(); }, function () { S.admin = null; render(); }); }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-x]'); if (!a || a.tagName === 'SELECT') return;
    var x = a.dataset.x;
    if (x === 'eye') { var inp = a.parentNode.querySelector('input'); var show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; a.innerHTML = ic(show ? 'eyeoff' : 'eye', 20); a.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'); return; }
    e.preventDefault();
    if (x === 'bySlug') { S.bySlug = !S.bySlug; render(); }
    else if (x === 'period') { S.ck.period = a.dataset.v; render(); }
    else if (x === 'kind') { S.ck.kind = a.dataset.v; history.replaceState(null, '', '#start/' + a.dataset.v); render(); }
    else if (x === 'next') { if (S.ck.kind) { S.ck.step = 2; render(); window.scrollTo(0, 0); } }
    else if (x === 'back') { S.ck.step = Math.max(1, S.ck.step - 1); render(); }
    else if (x === 'simpay') { busy(a, true); S.simPending = true; after('/app?paid=' + encodeURIComponent(a.dataset.co)); payState.tries = 0; setTimeout(function () { S.simPending = false; confirmPay(a.dataset.co, true); }, 900); }
    else if (x === 'retry') { busy(a, true); api('checkout/attempt', { co: a.dataset.co }).then(function (j) { busy(a, false); if (j.given_id) { j.description = 'شاهين ديزاين · ' + (j.co.title || ''); j.pk = S.plans && S.plans.pk; return (S.plans ? Promise.resolve() : loadPlans()).then(function () { j.pk = S.plans.pk; showPay(j); }); } after('/app?paid=' + encodeURIComponent(a.dataset.co)); }, function (er) { busy(a, false); toast(er.error); }); }
    else if (x === 'recheck') { payState.tries = 0; confirmPay(new URLSearchParams(location.search).get('paid')); }
    else if (x === 'dropco') { LS.del('sd-checkout'); var b = $('rcb'); if (b) b.remove(); }
    else if (x === 'rper') { S.renewPeriod = a.dataset.v; render(); }
    else if (x === 'switch') { S.cur = a.dataset.v; loadMe().then(render); }
    else if (x === 'copy') { try { navigator.clipboard.writeText(a.dataset.v); toast('انسخ الرابط'); } catch (er) { toast(a.dataset.v); } }
    else if (x === 'print') window.print();
    else if (x === 'goInvoice') { history.replaceState(null, '', '/app#invoice/' + a.getAttribute('href').split('/')[1]); render(); }
    else if (x === 'menu') sheet('<div class="stack"><h3>' + E(S.me ? (S.me.account.kind === 'p' ? S.me.account.phone : S.me.tenant.slug) : 'حسابي') + '</h3><a class="btn ghost" href="#account" data-x="close">' + ic('user', 18) + 'الحساب وكلمة المرور</a><a class="btn ghost" href="#billing" data-x="close">' + ic('receipt', 18) + 'الفوترة والفواتير</a><button class="btn ghost" data-x="logout">' + ic('out', 18) + 'خروج من هالجهاز</button><button class="btn danger" data-x="logoutAll">' + ic('devices', 18) + 'خروج من كل الأجهزة</button></div>');
    else if (x === 'close') { closeSheet(); location.hash = a.getAttribute('href'); }
    else if (x === 'logout' || x === 'logoutAll') {
      if (x === 'logoutAll' && !confirm('بيطلع حسابك من كل الجوالات والأجهزة. موظفينك ما يتأثرون. أكمل؟')) return;
      api(x === 'logout' ? 'logout' : 'logout-all').then(function () { S.me = null; S.flash = 'طلعت من حسابك'; LS.del('sd-cur'); after('/app'); }, function (er) { toast(er.error); });
    }
    else if (x === 'paySheet') sheet('<form class="stack" id="mpay"><h3>تسجيل دفعة يدوية</h3><p class="small muted">تمدد الاشتراك وتطلع فاتورة بنفس التسلسل.</p><input type="hidden" name="slug" value="' + E(a.dataset.slug) + '"><div class="grid2"><label class="f">المدة<select name="months"><option value="1">شهر</option><option value="3">٣ أشهر</option><option value="6">٦ أشهر</option><option value="12">سنة</option></select></label><label class="f">المبلغ (ر.س)<input name="amount" type="number" min="1" step="0.01" required></label></div><label class="f">الطريقة<select name="method"><option>تحويل بنكي</option><option>كاش</option><option>رابط دفع</option></select></label><label class="check"><input type="checkbox" name="resume" checked>شغّل الحساب لو كان موقوف</label><button class="btn">تسجيل وإصدار فاتورة</button></form>'), (function () { var mf = $('mpay'); mf.onsubmit = function (ev) { ev.preventDefault(); var d = Object.fromEntries(new FormData(mf)); api('admin', { action: 'pay', slug: d.slug, months: Number(d.months), period: d.months === '12' ? 'y' : 'm', amount: Number(d.amount), method: d.method, resume: !!d.resume }).then(function (j) { closeSheet(); toast('انسجلت الدفعة · ' + j.invoice); loadAdmin(); }, function (er) { toast(er.error); }); }; })();
    else if (['suspend', 'resume', 'code'].indexOf(x) >= 0) {
      if (x === 'suspend' && !confirm('إيقاف الاشتراك؟ صفحة العميل بتتوقف')) return;
      var slug = a.dataset.slug; api('admin', { action: x, slug: slug }).then(function (j) { if (j.code) { var t = S.admin.tenants.filter(function (y) { return y.slug === slug; })[0] || {}; S.made = { code: j.code, tenant: j.tenant, phone: t.phone || '' }; } toast(x === 'code' ? 'انصدر رابط جديد، الرابط القديم توقف' : 'تم'); loadAdmin(); }, function (er) { toast(er.error); });
    }
  });
  window.addEventListener('hashchange', function () { if (route().name === 'admin') loadAdmin(); else { if (route().name === 'start' && S.ck.step > 1 && !route().arg) S.ck.step = 1; render(); window.scrollTo(0, 0); } });
  // بعد الخروج: لو المتصفح رجّع الصفحة من الذاكرة، نحدّثها عشان ما تبين اللوحة
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
  var rq = new URLSearchParams(location.search).get('ref'); if (rq) LS.set('sd-ref', rq.slice(0, 20));
  if (route().name === 'admin') loadAdmin();
  else loadMe().then(function () { S.checked = true; render(); }, function () { S.checked = true; render(); });
  if (route().name === 'start' || new URLSearchParams(location.search).get('paid')) loadPlans().then(function () { if (route().name === 'start') render(); });
  if (route().name !== 'admin') render();
})();
</script>
</body>
</html>
